<style>

    --gris: #64748B;
    --rejilla: #E2E8F0;
    --eje: #CBD5E1;
    --acento: #F59E0B;
    --sobre-acento: #0F172A;
    --verde: #047857;
    --rojo: #B91C1C;
    --azul: #1D4ED8;
    --naranja: #C2410C;
    --morado: #6D28D9;
    --fondo-debe: #FEE2E2;
    --fondo-ok: #D1FAE5;
    --fondo-pend: #FEF3C7;
    --sombra: 0 1px 3px rgba(15,23,42,.08);
  }

    --superficie: #1E293B;
    --superficie-2: #273449;
    --borde: #334155;
    --texto: #F1F5F9;

    --gris: #94A3B8;

  .error { color: var(--rojo); font-size: 14px; min-height: 1em; }

  .kpi .det { font-size: 13px; color: var(--texto-2); }

  .tarjeta { background: var(--superficie); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--sombra); }

  .nota { color: var(--gris); font-size: 13px; margin: -6px 0 0; }

  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--texto-2); }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .grafica { width: 100%; overflow-x: auto; }
  .grafica svg { display: block; width: 100%; height: auto; }
  .grafica svg.ancha { min-width: 560px; }
  svg .rejilla { stroke: var(--rejilla); }
  svg .eje { stroke: var(--eje); }
  svg text { fill: var(--gris); font-family: inherit; }
  svg text.fuerte { fill: var(--texto-2); font-weight: 700; }
  svg text.nombre { fill: var(--texto); font-weight: 600; }

  details.ver-tabla > summary { cursor: pointer; color: var(--azul); font-size: 14px; font-weight: 600; list-style: none; }
  details.ver-tabla > summary::before { content: "▸ "; }
  details.ver-tabla[open] > summary::before { content: "▾ "; }
  details.ver-tabla > .tabla { margin-top: 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--gris); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--borde); }
  tbody tr:last-child td { border-bottom: none; }
  tfoot td { font-weight: 800; border-top: 2px solid var(--eje); }
  td:first-child { white-space: nowrap; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tenue { color: var(--gris); }
  .tabla { overflow-x: auto; }
  .punto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
  .estado { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }

  .vacio { color: var(--gris); font-size: 14px; padding: 8px 0; }
  .mas { align-self: flex-start; }

  .deudas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .deuda { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .deuda .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .deuda .nombre { font-weight: 700; font-size: 16px; }
  .deuda .puesto { color: var(--gris); font-size: 12px; }
  .deuda .saldo { font-size: 22px; font-weight: 800; color: var(--rojo); font-variant-numeric: tabular-nums; }
  .deuda .progreso { height: 8px; border-radius: 4px; background: var(--borde); overflow: hidden; }

  .deuda .mini { display: flex; justify-content: space-between; font-size: 12px; color: var(--texto-2); }
  .deuda details summary { cursor: pointer; color: var(--azul); font-size: 13px; }
  .deuda details ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .deuda details li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--borde); padding-bottom: 4px; }

  #tooltip { position: fixed; pointer-events: none; background: var(--superficie); color: var(--texto); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; font-size: 13px; min-width: 170px; box-shadow: 0 8px 24px rgba(15,23,42,.18); z-index: 10; }
  #tooltip .t { font-weight: 700; margin-bottom: 6px; }
  #tooltip .r { display: flex; justify-content: space-between; gap: 14px; }
  #tooltip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--texto-2); }
  #tooltip .total { border-top: 1px solid var(--borde); margin-top: 6px; padding-top: 6px; font-weight: 700; }
</style>
</head>

const fmtFecha = (ms) => { const d = new Date(ms); return d.getDate() + " " + MESES[d.getMonth()] + " " + d.getFullYear(); };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const suma = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

const datos = { camiones: [], pilotos: [], diesel: [], movimientos: [] };

// ---------------- Periodo ----------------
function rangoPeriodo() {
  const hoy = new Date();
  const y = hoy.getFullYear(), m = hoy.getMonth();
  const fin = new Date(y, m, hoy.getDate(), 23, 59, 59, 999).getTime();
  switch ($("fPeriodo").value) {
    case "quincena": return { ini: new Date(y, m, hoy.getDate() <= 15 ? 1 : 16).getTime(), fin, txt: "esta quincena" };
    case "mesPasado": return { ini: new Date(y, m - 1, 1).getTime(), fin: new Date(y, m, 1).getTime() - 1, txt: MESES[(m + 11) % 12] + " " + (m === 0 ? y - 1 : y) };
    case "3meses": return { ini: new Date(y, m - 2, 1).getTime(), fin, txt: "últimos 3 meses" };
    case "anio": return { ini: new Date(y, 0, 1).getTime(), fin, txt: "año " + y };
    case "todo": return { ini: 0, fin, txt: "todo el historial" };
    default: return { ini: new Date(y, m, 1).getTime(), fin, txt: MESES[m] + " " + y };
  }
}

// ---------------- Cálculos comunes ----------------
function contexto() {
  const { camiones, pilotos, diesel, movimientos } = datos;
  const P = pal();
  const colorCamion = {};
  camiones.forEach((c, i) => colorCamion[c.id] = P.serie[i % P.serie.length]);
  const nombreCamion = Object.fromEntries(camiones.map((c) => [c.id, c.nombre]));
  const nombrePersona = Object.fromEntries(pilotos.map((p) => [p.id, p.nombre]));
  const duenoDe = Object.fromEntries(camiones.map((c) => [c.id, (c.dueno || "").trim() || SIN_DUENO]));
  const duenos = [...new Map(camiones.filter((c) => (c.dueno || "").trim()).map((c) => [c.dueno.trim().toLowerCase(), c.dueno.trim()])).values()].sort((a, b) => a.localeCompare(b));

  // Selector de dueños
  const selD = $("fDueno"), elegD = selD.value;
  selD.innerHTML = '<option value="">Todos los dueños</option>' + duenos.map((d) => `<option value="${esc(d)}">${esc(d)}</option>`).join("");
  selD.value = duenos.includes(elegD) ? elegD : "";
  const fDue = selD.value;
  $("campoDueno").style.display = duenos.length ? "" : "none";

  // Selector de camiones (solo los del dueño elegido)
  const camDue = camiones.filter((c) => !fDue || duenoDe[c.id].toLowerCase() === fDue.toLowerCase());
  const sel = $("fCamion"), elegido = sel.value;
  sel.innerHTML = '<option value="">Todos los camiones</option>' +
    camDue.map((c) => `<option value="${esc(c.id)}">${esc(c.nombre)}${c.placa ? " · " + esc(c.placa) : ""}</option>`).join("");
  sel.value = camDue.some((c) => c.id === elegido) ? elegido : "";
  const fCam = sel.value;
  const camionesVisibles = fCam ? camiones.filter((c) => c.id === fCam) : camDue;
  const idsVisibles = new Set(camionesVisibles.map((c) => c.id));
  const filtrandoCamion = !!(fCam || fDue);

  const r = rangoPeriodo();
  const enRango = (ms) => ms >= r.ini && ms <= r.fin;
  const cargas = diesel.filter((d) => !filtrandoCamion || idsVisibles.has(d.camionId));
  const cargasRango = cargas.filter((d) => enRango(d.fecha));
  const movs = movimientos.filter((m) => m.tipo === "ADELANTO" || m.tipo === "ABONO" || m.tipo === "PAGO");
  const gastos = movimientos.filter((m) => m.tipo === "GASTO" && (!filtrandoCamion || idsVisibles.has(m.camionId)));
  const gastosRango = gastos.filter((g) => enRango(g.fecha));
  const saldo = (pid) => suma(movs.filter((m) => m.pilotoId === pid), (m) => m.tipo === "ADELANTO" ? m.monto : m.tipo === "ABONO" ? -m.monto : 0);
  const camionDePersona = Object.fromEntries(pilotos.map((p) => [p.id, p.camionId]));
  const camionDeMov = (m) => m.camionId || camionDePersona[m.pilotoId] || "";
  return { camiones, pilotos, P, colorCamion, nombreCamion, nombrePersona, duenoDe, duenos, fDue, fCam, r, enRango, cargas, cargasRango, movs, gastos, gastosRango, saldo, camionesVisibles, idsVisibles, camionDeMov };
}

function kpi(etq, val, det, color, enlace) {
  const tag = enlace ? "a" : "div";
  return `<${tag} class="kpi" ${enlace ? `href="#${enlace}"` : ""} style="--color:${color}"><span class="etq">${etq}</span><span class="val">${val}</span><span class="det">${det}</span></${tag}>`;
}
const verTabla = (html, abierta) => `<details class="ver-tabla" ${abierta ? "open" : ""}><summary>Ver tabla con los números</summary>${html}</details>`;

// ---------------- Lo que gastó cada dueño ----------------
function porDueno(k) {
  const nombres = [...k.duenos, SIN_DUENO].filter((d) => !k.fDue || d.toLowerCase() === k.fDue.toLowerCase());
  return nombres.map((d) => {
    const ids = new Set(k.camiones.filter((c) => k.duenoDe[c.id].toLowerCase() === d.toLowerCase()).map((c) => c.id));
    const diesel = suma(k.cargasRango.filter((x) => ids.has(x.camionId)), (x) => x.monto);
    const gastos = suma(k.gastosRango.filter((x) => ids.has(x.camionId)), (x) => x.monto);
    const adelantos = suma(k.movs.filter((m) => m.tipo === "ADELANTO" && k.enRango(m.fecha) && ids.has(k.camionDeMov(m))), (m) => m.monto);
    return { nombre: d, camiones: ids.size, diesel, gastos, adelantos, total: diesel + gastos + adelantos };
  }).filter((f) => f.camiones > 0 && (f.nombre !== SIN_DUENO || f.total > 0)).sort((a, b) => b.total - a.total);
}

// ---------- INICIO ----------
function vistaInicio(k) {
  const totalDiesel = suma(k.cargasRango, (d) => d.monto);
  const pendiente = suma(k.cargasRango.filter((d) => !d.pagado), (d) => d.monto);
  const totalGastos = suma(k.gastosRango, (g) => g.monto);
  const adelantado = suma(k.movs.filter((m) => m.tipo === "ADELANTO" && k.enRango(m.fecha)), (m) => m.monto);
  const deuda = suma(k.pilotos, (p) => Math.max(0, k.saldo(p.id)));
  const conDeuda = k.pilotos.filter((p) => k.saldo(p.id) > 0).length;
  const dues = porDueno(k);
  return `
    <div class="kpis">
      ${kpi("Diésel gastado", fmtQ(totalDiesel), `${fmtGal(suma(k.cargasRango, (d) => d.galones))} galones · ${k.cargasRango.length} cargas`, k.P.diesel, "diesel")}
      ${kpi("Diésel pendiente de pagar", fmtQ(pendiente), "Pagado: " + fmtQ(totalDiesel - pendiente), k.P.diesel, "diesel")}
      ${kpi("Otros gastos", fmtQ(totalGastos), k.gastosRango.length + " gastos", k.P.gasto, "gastos")}
      ${kpi("Total adelantado", fmtQ(adelantado), "Pilotos y ayudantes", k.P.adelanto, "personal")}
      ${kpi("Deudas pendientes (hoy)", fmtQ(deuda), conDeuda + (conDeuda === 1 ? " persona debe" : " personas deben"), k.P.debe, "deudas")}
    </div>
    <div class="tarjeta">
      <h2>Gasto total por mes</h2>
      <p class="nota">Diésel y otros gastos · últimos 12 meses · pasa el cursor o toca una barra para ver el detalle</p>
      ${graficaMeses("inicio", [
        { id: "d", nombre: "Diésel", color: k.P.diesel, items: k.cargas },
        { id: "g", nombre: "Otros gastos", color: k.P.gasto, items: k.gastos }
      ])}
    </div>
    ${dues.length ? `<div class="tarjeta">
      <h2>Gasto por dueño</h2>
      <p class="nota">Diésel + gastos + adelantos de ${esc(k.r.txt)}</p>
      ${barrasH("inicioDue", dues.map((f) => ({ nombre: f.nombre, valores: { d: f.diesel, g: f.gastos, a: f.adelantos } })),
        [{ id: "d", nombre: "Diésel", color: k.P.diesel }, { id: "g", nombre: "Gastos", color: k.P.gasto }, { id: "a", nombre: "Adelantos", color: k.P.adelanto }])}
    </div>` : ""}`;
}

// ---------- DIÉSEL ----------
function vistaDiesel(k) {
  const total = suma(k.cargasRango, (d) => d.monto), gal = suma(k.cargasRango, (d) => d.galones);
  const pend = suma(k.cargasRango.filter((d) => !d.pagado), (d) => d.monto);
  const filas = k.camionesVisibles.map((c) => {
    const suyas = k.cargasRango.filter((d) => d.camionId === c.id);
    return { c, n: suyas.length, gal: suma(suyas, (d) => d.galones), total: suma(suyas, (d) => d.monto), pend: suma(suyas.filter((d) => !d.pagado), (d) => d.monto) };
  }).sort((a, b) => b.total - a.total);
  const detalle = [...k.cargasRango].sort((a, b) => a.fecha - b.fecha);

  return `
    <div class="kpis">
      ${kpi("Total en diésel", fmtQ(total), k.cargasRango.length + " cargas", k.P.diesel)}
      ${kpi("Galones", fmtGal(gal), gal > 0 ? "Promedio " + fmtQ(total / gal) + " por galón" : "—", k.P.diesel)}
      ${kpi("Pendiente de pagar", fmtQ(pend), "Pagado: " + fmtQ(total - pend), k.P.debe)}
    </div>
    <div class="tarjeta">
      <h2>Diésel por mes</h2>
      <p class="nota">Últimos 12 meses por camión</p>
      ${graficaMeses("diesel", k.camionesVisibles.map((c) => ({ id: c.id, nombre: c.nombre, color: k.colorCamion[c.id], items: k.cargas.filter((d) => d.camionId === c.id) })))}
    </div>
    <div class="tarjeta">
      <h2>Diésel por camión</h2>
      <p class="nota">${esc(k.r.txt)} · pagado y pendiente</p>
      ${barrasH("dieselCam", filas.map((f) => ({ nombre: f.c.nombre, valores: { p: f.total - f.pend, n: f.pend } })),
        [{ id: "p", nombre: "Pagado", color: k.P.abono }, { id: "n", nombre: "Pendiente", color: k.P.diesel }])}
      ${verTabla(filas.length === 0 ? '<div class="vacio">Aún no hay camiones registrados.</div>' : `<div class="tabla"><table>
        <thead><tr><th>Camión</th><th>Dueño</th><th class="num">Cargas</th><th class="num">Galones</th><th class="num">Q / galón</th><th class="num">Total</th><th class="num">Pendiente</th></tr></thead>
        <tbody>${filas.map((f) => `<tr>
          <td><span class="punto" style="background:${k.colorCamion[f.c.id]}"></span>${esc(f.c.nombre)}</td><td class="tenue">${esc(k.duenoDe[f.c.id])}</td>
          <td class="num">${f.n}</td><td class="num">${fmtGal(f.gal)}</td><td class="num">${f.gal > 0 ? fmtQ(f.total / f.gal) : "—"}</td>
          <td class="num"><b>${fmtQ(f.total)}</b></td><td class="num">${fmtQ(f.pend)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>TOTAL</td><td></td><td class="num">${suma(filas, (f) => f.n)}</td><td class="num">${fmtGal(suma(filas, (f) => f.gal))}</td><td></td><td class="num">${fmtQ(suma(filas, (f) => f.total))}</td><td class="num">${fmtQ(suma(filas, (f) => f.pend))}</td></tr></tfoot>
      </table></div>`)}
    </div>
    <div class="tarjeta">
      <h2>Detalle por fecha y camión</h2>
      ${verTabla(tablaDetalle("diesel", detalle,
        ["Fecha", "Camión", "Dueño", "Galones", "Q / galón", "Total", "Estado"], [false, false, false, true, true, true, false],
        (d) => [fmtFecha(d.fecha), `<span class="punto" style="background:${k.colorCamion[d.camionId] || "#94A3B8"}"></span>${esc(k.nombreCamion[d.camionId] || "Camión eliminado")}`, `<span class="tenue">${esc(k.duenoDe[d.camionId] || "—")}</span>`, fmtGal(d.galones), d.galones > 0 ? fmtQ(d.monto / d.galones) : "—", `<b>${fmtQ(d.monto)}</b>`, d.pagado ? '<span class="estado aldia">✓ Pagado</span>' : '<span class="estado pend">● Pendiente</span>'],
        "Sin cargas de diésel en este periodo.", [fmtGal(gal), "", fmtQ(total), ""]), false)}
    </div>`;
}

// ---------- GASTOS ----------
function vistaGastos(k) {
  const sel = $("fCategoria");
  if (!sel.options.length) sel.innerHTML = '<option value="">Todos los tipos</option>' + CATEGORIAS.map((c) => `<option value="${c.id}">${c.nombre}</option>`).join("");
  const fCat = sel.value;
  const lista = k.gastosRango.filter((g) => !fCat || g.categoria === fCat);
  const total = suma(lista, (g) => g.monto);
  const cats = fCat ? CATEGORIAS.filter((c) => c.id === fCat) : CATEGORIAS;
  const filasCam = [...k.camionesVisibles.map((c) => ({ id: c.id, nombre: c.nombre })), { id: "", nombre: "Sin camión" }].map((c) => {
    const suyos = lista.filter((g) => (g.camionId || "") === c.id);
    return { c, porCat: Object.fromEntries(cats.map((x) => [x.id, suma(suyos.filter((g) => g.categoria === x.id), (g) => g.monto)])), total: suma(suyos, (g) => g.monto) };
  }).filter((f) => f.total > 0).sort((a, b) => b.total - a.total);
  const detalle = [...lista].sort((a, b) => b.fecha - a.fecha);
  const series = cats.map((c) => ({ id: c.id, nombre: c.nombre, color: colorCat(c.id) }));

  return `
    <div class="kpis">
      ${kpi("Total en gastos", fmtQ(total), lista.length + " gastos", k.P.gasto)}
      ${CATEGORIAS.map((c) => kpi(c.nombre, fmtQ(suma(k.gastosRango.filter((g) => g.categoria === c.id), (g) => g.monto)), k.gastosRango.filter((g) => g.categoria === c.id).length + " registros", colorCat(c.id))).join("")}
    </div>
    <div class="tarjeta">
      <h2>Gastos por mes</h2>
      <p class="nota">Últimos 12 meses por tipo</p>
      ${graficaMeses("gastos", series.map((s) => ({ ...s, items: k.gastos.filter((g) => g.categoria === s.id) })))}
    </div>
    <div class="tarjeta">
      <h2>Gastos por camión</h2>
      <p class="nota">${esc(k.r.txt)} · por tipo de gasto</p>
      ${barrasH("gastosCam", filasCam.map((f) => ({ nombre: f.c.nombre, valores: f.porCat })), series)}
      ${verTabla(filasCam.length === 0 ? '<div class="vacio">Sin gastos en este periodo.</div>' : `<div class="tabla"><table>
        <thead><tr><th>Camión</th>${cats.map((c) => `<th class="num">${c.nombre}</th>`).join("")}<th class="num">Total</th></tr></thead>
        <tbody>${filasCam.map((f) => `<tr><td>${esc(f.c.nombre)}</td>${cats.map((c) => `<td class="num">${f.porCat[c.id] > 0 ? fmtQ(f.porCat[c.id]) : '<span class="tenue">—</span>'}</td>`).join("")}<td class="num"><b>${fmtQ(f.total)}</b></td></tr>`).join("")}</tbody>
        <tfoot><tr><td>TOTAL</td>${cats.map((c) => `<td class="num">${fmtQ(suma(filasCam, (f) => f.porCat[c.id]))}</td>`).join("")}<td class="num">${fmtQ(total)}</td></tr></tfoot>
      </table></div>`)}
    </div>
    <div class="tarjeta">
      <h2>Detalle de gastos</h2>
      ${verTabla(tablaDetalle("gastos", detalle,
        ["Fecha", "Tipo", "Gasto", "Camión", "Se le dio a", "Monto"], [false, false, false, false, false, true],
        (g) => [fmtFecha(g.fecha), `<span class="chip" style="background:${colorCat(g.categoria)}">${nombreCat(g.categoria)}</span>`, `<b>${esc(g.titulo)}</b>${g.nota ? `<br><span class="tenue" style="font-size:12px">${esc(g.nota)}</span>` : ""}`, esc(k.nombreCamion[g.camionId] || "—"), esc(k.nombrePersona[g.pilotoId] || "—"), `<b>${fmtQ(g.monto)}</b>`],
        "Sin gastos en este periodo.", [fmtQ(total)]), false)}
    </div>`;
}

  // Si hay un dueño elegido, desglose por cada uno de sus camiones
  const porCamion = k.fDue ? k.camionesVisibles.map((c) => {
    const diesel = suma(k.cargasRango.filter((x) => x.camionId === c.id), (x) => x.monto);
    const gastos = suma(k.gastosRango.filter((x) => x.camionId === c.id), (x) => x.monto);
    const adelantos = suma(k.movs.filter((m) => m.tipo === "ADELANTO" && k.enRango(m.fecha) && k.camionDeMov(m) === c.id), (m) => m.monto);
    return { nombre: c.nombre, diesel, gastos, adelantos, total: diesel + gastos + adelantos };
  }).sort((a, b) => b.total - a.total) : [];
  const tabla = (lista, col) => `<div class="tabla"><table>

    <tfoot><tr><td>TOTAL</td><td class="num">${fmtQ(suma(lista, (f) => f.diesel))}</td><td class="num">${fmtQ(suma(lista, (f) => f.gastos))}</td><td class="num">${fmtQ(suma(lista, (f) => f.adelantos))}</td><td class="num">${fmtQ(suma(lista, (f) => f.total))}</td></tr></tfoot>
  </table></div>`;
  return `

function tablaDetalle(clave, filas, enc, derecha, celdas, vacio, totales) {
  if (filas.length === 0) return `<div class="vacio">${vacio}</div>`;
  const LIM = 40, todas = mostrarTodo[clave], visibles = todas ? filas : filas.slice(0, LIM);

  return `<div class="tabla"><table>

// =====================================================================
//  GRÁFICAS (SVG hechas a mano)
// =====================================================================
const graficas = {};
const leyenda = (series) => series.length > 1 ? `<div class="leyenda">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.nombre)}</span>`).join("")}</div>` : "";

function ultimos12() {
  const hoy = new Date(), meses = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    meses.push({ y: d.getFullYear(), m: d.getMonth(), ini: d.getTime(), fin: new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime() - 1 });
  }
  return meses;
}

// Barras verticales apiladas por mes
function graficaMeses(id, series) {
  const meses = ultimos12();
  const valores = meses.map((mes) => {
    const por = {};
    series.forEach((s) => por[s.id] = suma(s.items.filter((x) => x.fecha >= mes.ini && x.fecha <= mes.fin), (x) => x.monto));
    return { titulo: MESES[mes.m] + " " + mes.y, por, total: Object.values(por).reduce((a, b) => a + b, 0) };
  });
  graficas[id] = { valores, series };

  const W = 900, H = 290, izq = 64, der = 12, arr = 18, aba = 34;
  const ancho = W - izq - der, alto = H - arr - aba;
  const maxV = Math.max(0, ...valores.map((v) => v.total));
  const paso = escalaBonita(maxV), tope = paso * 4;
  const y = (v) => arr + alto - (v / tope) * alto;
  const col = ancho / 12, barra = Math.min(46, col * 0.62);
  const iMax = valores.findIndex((v) => v.total > 0 && v.total === maxV);

  let svg = `<svg class="ancha" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica por mes">`;
  for (let i = 0; i <= 4; i++) {
    const v = paso * i, yy = y(v);
    svg += `<line class="${i === 0 ? "eje" : "rejilla"}" x1="${izq}" x2="${W - der}" y1="${yy}" y2="${yy}" stroke-width="1"/>`;
    svg += `<text x="${izq - 10}" y="${yy + 4}" text-anchor="end" font-size="12">${fmtQcorto(v)}</text>`;
  }
  valores.forEach((v, i) => {
    const cx = izq + col * i + col / 2, x = cx - barra / 2;
    let base = 0;
    const segs = series.filter((s) => v.por[s.id] > 0);
    segs.forEach((s, j) => {
      const val = v.por[s.id], y1 = y(base + val), y0 = y(base);
      svg += j === segs.length - 1 ? `<path d="${rectArriba(x, y1, barra, y0 - y1, 4)}" fill="${s.color}"/>`
        : `<rect x="${x}" y="${y1 + 2}" width="${barra}" height="${Math.max(0, y0 - y1 - 2)}" fill="${s.color}"/>`;
      base += val;
    });
    const m = meses[i];
    svg += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="12">${MESES[m.m]}${m.m === 0 || i === 0 ? " " + String(m.y).slice(2) : ""}</text>`;
    if (i === iMax) svg += `<text class="fuerte" x="${cx}" y="${y(v.total) - 6}" text-anchor="middle" font-size="11">${fmtQcorto(v.total)}</text>`;
    svg += `<rect class="zona" data-g="${id}" data-i="${i}" x="${izq + col * i}" y="${arr}" width="${col}" height="${alto}" fill="transparent"/>`;
  });
  svg += "</svg>";
  return leyenda(series) + `<div class="grafica">${svg}</div>` + (maxV === 0 ? '<div class="vacio">Sin registros en los últimos 12 meses.</div>' : "");
}

// Barras horizontales (apiladas, o agrupadas si agrupar = true), una fila por nombre
function barrasH(id, filas, series, agrupar) {
  filas = filas.filter((f) => series.some((s) => (f.valores[s.id] || 0) > 0));
  if (filas.length === 0) return '<div class="vacio">Sin datos en este periodo.</div>';
  const valores = filas.map((f) => ({ titulo: f.nombre, por: f.valores, total: series.reduce((a, s) => a + (f.valores[s.id] || 0), 0) }));
  graficas[id] = { valores, series };

  // Ancho según la pantalla, para que en el celular las letras no queden chiquitas
  const W = Math.max(340, Math.min(900, (window.innerWidth || 900) - (window.innerWidth > 900 ? 320 : 60)));
  const izq = W < 600 ? 104 : 150, der = W < 600 ? 62 : 90, arr = 6;
  const sub = agrupar ? series.length : 1;
  const alto = agrupar ? 12 * sub + 4 * (sub - 1) : 22, sep = agrupar ? 20 : 14;
  const H = arr + filas.length * (alto + sep) + 4;
  const ancho = W - izq - der;
  const maxV = Math.max(...valores.map((v) => agrupar ? Math.max(...series.map((s) => v.por[s.id] || 0)) : v.total), 1);
  const x = (v) => izq + (v / maxV) * ancho;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de barras">`;
  svg += `<line class="eje" x1="${izq}" x2="${izq}" y1="0" y2="${H}" stroke-width="1"/>`;
  valores.forEach((v, i) => {
    const y0 = arr + i * (alto + sep);
    const maxL = W < 600 ? 13 : 20;
    svg += `<text class="nombre" x="${izq - 10}" y="${y0 + alto / 2 + 4}" text-anchor="end" font-size="13">${esc(v.titulo.length > maxL ? v.titulo.slice(0, maxL - 1) + "…" : v.titulo)}</text>`;
    if (agrupar) {
      series.forEach((s, j) => {
        const val = v.por[s.id] || 0, yy = y0 + j * 16;
        if (val > 0) svg += `<path d="${rectDerecha(izq, yy, x(val) - izq, 12, 4)}" fill="${s.color}"/>`;
      });
      svg += `<text class="fuerte" x="${x(Math.max(...series.map((s) => v.por[s.id] || 0))) + 8}" y="${y0 + alto / 2 + 4}" font-size="12">${fmtQcorto(v.total)}</text>`;
    } else {
      let base = 0;
      const segs = series.filter((s) => (v.por[s.id] || 0) > 0);
      segs.forEach((s, j) => {
        const val = v.por[s.id], x0 = x(base), x1 = x(base + val);
        svg += j === segs.length - 1 ? `<path d="${rectDerecha(x0 + (j > 0 ? 2 : 0), y0, x1 - x0 - (j > 0 ? 2 : 0), alto, 4)}" fill="${s.color}"/>`
          : `<rect x="${x0 + (j > 0 ? 2 : 0)}" y="${y0}" width="${Math.max(0, x1 - x0 - (j > 0 ? 2 : 0))}" height="${alto}" fill="${s.color}"/>`;
        base += val;
      });
      svg += `<text class="fuerte" x="${x(v.total) + 8}" y="${y0 + alto / 2 + 4}" font-size="12">${fmtQcorto(v.total)}</text>`;
    }
    svg += `<rect class="zona" data-g="${id}" data-i="${i}" x="0" y="${y0 - sep / 2}" width="${W}" height="${alto + sep}" fill="transparent"/>`;
  });
  svg += "</svg>";
  return leyenda(series) + `<div class="grafica">${svg}</div>`;
}

function activarGraficas() {
  const tt = $("tooltip");
  tt.hidden = true;
  const mostrarTT = (z, e) => {
    const g = graficas[z.dataset.g], v = g.valores[+z.dataset.i];
    tt.innerHTML = `<div class="t">${esc(v.titulo)}</div>` +
      g.series.filter((s) => (v.por[s.id] || 0) > 0).map((s) =>
        `<div class="r"><span><i class="punto" style="background:${s.color};margin:0"></i>${esc(s.nombre)}</span><span>${fmtQ(v.por[s.id])}</span></div>`).join("") +
      (g.series.length > 1 ? `<div class="r total"><span>Total</span><span>${fmtQ(v.total)}</span></div>` : "");
    tt.hidden = false;
    tt.style.left = Math.min(e.clientX + 14, window.innerWidth - tt.offsetWidth - 8) + "px";
    tt.style.top = Math.max(8, e.clientY - tt.offsetHeight - 10) + "px";
    document.querySelectorAll(".zona").forEach((o) => o.setAttribute("fill", "transparent"));
    z.setAttribute("fill", "rgba(100,116,139,0.10)");
  };
  document.querySelectorAll(".zona").forEach((z) => {
    z.addEventListener("mousemove", (e) => mostrarTT(z, e));
    z.addEventListener("click", (e) => mostrarTT(z, e));
    z.addEventListener("mouseleave", () => { tt.hidden = true; z.setAttribute("fill", "transparent"); });
  });
}
document.addEventListener("scroll", () => { $("tooltip").hidden = true; }, { passive: true });

function escalaBonita(max) {
  if (max <= 0) return 1000;
  const bruto = max / 4, mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  for (const f of [1, 2, 2.5, 5, 10]) if (f * mag >= bruto) return f * mag;
  return 10 * mag;
}
function rectArriba(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}
function rectDerecha(x, y, w, h, r) {
  w = Math.max(w, 0); r = Math.min(r, w, h / 2);
  return `M${x},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} L${x},${y + h} Z`;
}

    { pilotoId: "p5", tipo: "ADELANTO", monto: 1200, fecha: d(0, 9), nota: "" },
    { pilotoId: "p3", tipo: "PAGO", monto: 3000, fecha: d(0, 15), nota: "Salario" }
  );
  datos.diesel = diesel;
  datos.movimientos = movs.map((m) => ({ camionId: "", categoria: "", titulo: "", pilotoId: "", ...m }));
  $("avisoDemo").hidden = false;
  $("botonSalir").hidden = true;
  $("usuarioLateral").textContent = "Datos de ejemplo";
  mostrar("vistaPanel");
  pintarMenu();
  dibujar();
}

// ---------------- Firebase: login + lectura en tiempo real (nunca escribe) ----------------
async function iniciarFirebase() {
  const [{ initializeApp }, authMod, fsMod] = await Promise.all([
    import(FB + "firebase-app.js"), import(FB + "firebase-auth.js"), import(FB + "firebase-firestore.js")
  ]);
  const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } = authMod;
  const { getFirestore, doc, getDoc, collection, onSnapshot } = fsMod;
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app), db = getFirestore(app);
  let escuchas = [];

  const salir = () => { escuchas.forEach((u) => u()); escuchas = []; signOut(auth); };
  $("botonSalir").onclick = salir;
  $("botonSalir2").onclick = salir;

  $("formLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const u = $("usuario").value.trim().toLowerCase();
    $("errorLogin").textContent = "";
    $("botonEntrar").disabled = true;
    try {
      await signInWithEmailAndPassword(auth, u + DOMINIO_USUARIOS, $("clave").value);
    } catch (err) {
      const c = err.code || "";
      $("errorLogin").textContent = c.includes("invalid") || c.includes("wrong") || c.includes("not-found")
        ? "Usuario o contraseña incorrectos" : c.includes("network") ? "Sin internet" : "No se pudo entrar (" + c + ")";
    }
    $("botonEntrar").disabled = false;
  });

  onAuthStateChanged(auth, async (user) => {
    escuchas.forEach((u) => u()); escuchas = [];
    if (!user) { mostrar("vistaLogin"); return; }
    mensaje("Cargando…", "");
    try {
      const e = await getDoc(doc(db, "empresa", "principal"));
      const esMaster = e.exists() && e.data().master === user.uid;
      if (!esMaster) {
        const miembro = await getDoc(doc(db, "empresa", "principal", "miembros", user.uid));
        if (!miembro.exists()) { mensaje("Sin acceso todavía", "Tu usuario aún no ha sido aprobado por el máster. Pídele que te apruebe en la app (menú ☰ → Usuarios)."); return; }
      }
      const escuchar = (col, mapear) => escuchas.push(onSnapshot(collection(db, "empresa", "principal", col), (snap) => {
        datos[col] = snap.docs.map((d) => mapear(d.id, d.data()));
        if (col === "camiones" || col === "pilotos") datos[col].sort((a, b) => a.nombre.localeCompare(b.nombre));
        dibujar();
      }, () => mensaje("No se pudieron leer los datos", "Revisa tu conexión o tus permisos.")));
      escuchar("camiones", (id, x) => ({ id, nombre: x.nombre || "", placa: x.placa || "", dueno: x.dueno || "" }));
      escuchar("pilotos", (id, x) => ({ id, nombre: x.nombre || "", camionId: x.camionId || "", tipo: x.tipo || "PILOTO", salario: x.salario || 0 }));
      escuchar("diesel", (id, x) => ({ id, camionId: x.camionId || "", fecha: x.fecha || 0, galones: x.galones || 0, monto: x.monto || 0, pagado: !!x.pagado }));
      escuchar("movimientos", (id, x) => ({ id, pilotoId: x.pilotoId || "", tipo: x.tipo || "", monto: x.monto || 0, fecha: x.fecha || 0, nota: x.nota || "", categoria: x.categoria || "OTRO", titulo: x.titulo || "", camionId: x.camionId || "" }));
      $("usuarioLateral").textContent = user.email.replace(DOMINIO_USUARIOS, "") + (esMaster ? " · máster" : "");
      mostrar("vistaPanel");
      pintarMenu();
      dibujar();
    } catch (err) {
      mensaje("No se pudo cargar", String(err.message || err));
    }
  });
}

// En GitHub Pages usa tus datos reales; en cualquier otro lugar (vista previa) muestra datos de ejemplo
const esDemo = location.search.includes("demo") || !/github\.io$/.test(location.hostname);
if (esDemo) cargarDemo();
else iniciarFirebase().catch((e) => mensaje("No se pudo conectar", String(e.message || e)));
</script>
