<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transportes Morales — Panel</title>
<style>
  :root {
    --fondo: #0F172A;
    --superficie: #1E293B;
    --superficie-2: #273449;
    --borde: #334155;
    --texto: #F1F5F9;
    --texto-2: #CBD5E1;
    --gris: #94A3B8;
    --amarillo: #FBBF24;
    --verde: #6EE7B7;
    --rojo: #FCA5A5;
    --azul: #60A5FA;
    --naranja: #FB923C;
    --lateral: 232px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  button, select, input { font: inherit; }

  .centro { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .caja { width: 100%; max-width: 380px; background: var(--superficie); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .logo { width: 64px; height: 64px; border-radius: 20px; background: var(--amarillo); display: flex; align-items: center; justify-content: center; flex: none; }
  .caja h1 { margin: 0; font-size: 26px; }
  .caja p { margin: 0; color: var(--gris); }
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo label { font-size: 13px; color: var(--gris); }
  .campo input { height: 46px; border-radius: 12px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); padding: 0 14px; }
  .campo input:focus { outline: 2px solid var(--amarillo); border-color: transparent; }
  .boton { height: 48px; border: none; border-radius: 14px; background: var(--amarillo); color: var(--fondo); font-weight: 700; cursor: pointer; }
  .boton:disabled { opacity: .6; cursor: wait; }
  .boton-sec { height: 40px; border: 1px solid var(--borde); border-radius: 12px; background: transparent; color: var(--texto-2); padding: 0 14px; cursor: pointer; }
  .error { color: var(--rojo); font-size: 14px; min-height: 1em; }

  #vistaPanel { min-height: 100vh; }
  .lateral { position: fixed; inset: 0 auto 0 0; width: var(--lateral); background: var(--superficie); border-right: 1px solid var(--borde); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; }
  .marca { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
  .marca .logo { width: 40px; height: 40px; border-radius: 12px; }
  .marca b { font-size: 15px; line-height: 1.2; }
  .marca span { display: block; font-size: 12px; color: var(--gris); font-weight: 400; }
  .menu a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: var(--texto-2); text-decoration: none; font-weight: 600; font-size: 15px; }
  .menu a:hover { background: var(--superficie-2); color: var(--texto); }
  .menu a.activo { background: var(--amarillo); color: var(--fondo); }
  .menu svg { width: 20px; height: 20px; flex: none; }
  .lateral .pie { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--gris); padding: 0 6px; }
  .contenido { margin-left: var(--lateral); }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 24px 60px; display: flex; flex-direction: column; gap: 20px; }

  .menu-abajo { display: none; }
  .salir-movil { display: none; }
  @media (max-width: 900px) {
    .lateral { display: none; }
    .contenido { margin-left: 0; }
    main { padding: 18px 14px 100px; }
    .salir-movil { display: inline-block; }
    .menu-abajo { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: 68px; background: var(--superficie); border-top: 1px solid var(--borde); justify-content: space-around; align-items: center; z-index: 5; }
    .menu-abajo a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--gris); text-decoration: none; font-weight: 600; padding: 4px 4px; }
    .menu-abajo a svg { width: 22px; height: 22px; padding: 2px 10px; border-radius: 999px; box-sizing: content-box; }
    .menu-abajo a.activo { color: var(--amarillo); }
    .menu-abajo a.activo svg { background: var(--amarillo); color: var(--fondo); }
  }

  .encabezado { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .encabezado h1 { margin: 0; font-size: 26px; flex: 1; min-width: 200px; }
  .encabezado .sub { color: var(--gris); font-size: 13px; font-weight: 400; display: block; margin-top: 2px; }
  .aviso-demo { background: #422006; color: #FDE68A; border-radius: 12px; padding: 10px 14px; font-size: 14px; }
  .filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .filtros select { height: 42px; min-width: 180px; border-radius: 12px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); padding: 0 12px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 14px; }
  .kpi { background: var(--superficie); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; border-top: 4px solid var(--acento, var(--borde)); text-decoration: none; color: inherit; }
  a.kpi:hover { background: var(--superficie-2); }
  .kpi .etq { font-size: 13px; color: var(--gris); }
  .kpi .val { font-size: 24px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .kpi .det { font-size: 13px; color: var(--texto-2); }

  .tarjeta { background: var(--superficie); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .tarjeta h2 { margin: 0; font-size: 17px; }
  .nota { color: var(--gris); font-size: 13px; margin: -6px 0 0; }

  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--texto-2); }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .grafica { width: 100%; overflow-x: auto; }
  .grafica svg { display: block; width: 100%; min-width: 560px; height: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--gris); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--superficie-2); }
  tbody tr:last-child td { border-bottom: none; }
  tfoot td { font-weight: 800; border-top: 2px solid var(--borde); }
  td:first-child { white-space: nowrap; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tenue { color: var(--gris); }
  .tabla { overflow-x: auto; }
  .punto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
  .barrita { height: 8px; border-radius: 4px; background: var(--superficie-2); min-width: 80px; }
  .barrita > div { height: 8px; border-radius: 4px; }
  .estado { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .estado.debe { background: #450a0a; color: var(--rojo); }
  .estado.aldia { background: #052e1f; color: var(--verde); }
  .estado.pend { background: #422006; color: var(--amarillo); }
  .chip { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; white-space: nowrap; color: #fff; }
  .vacio { color: var(--gris); font-size: 14px; padding: 8px 0; }
  .mas { align-self: flex-start; }

  .deudas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .deuda { background: var(--superficie-2); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .deuda .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .deuda .nombre { font-weight: 700; font-size: 16px; }
  .deuda .puesto { color: var(--gris); font-size: 12px; }
  .deuda .saldo { font-size: 22px; font-weight: 800; color: var(--rojo); font-variant-numeric: tabular-nums; }
  .deuda .progreso { height: 8px; border-radius: 4px; background: var(--borde); overflow: hidden; }
  .deuda .progreso div { height: 8px; background: var(--verde); }
  .deuda .mini { display: flex; justify-content: space-between; font-size: 12px; color: var(--texto-2); }
  details summary { cursor: pointer; color: var(--azul); font-size: 13px; }
  details ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  details li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--borde); padding-bottom: 4px; }

  .lista-mov { display: flex; flex-direction: column; }
  .lista-mov > div { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--superficie-2); }
  .lista-mov > div:last-child { border-bottom: none; }
  .lista-mov .que { flex: 1; min-width: 0; }
  .lista-mov .que b { display: block; font-size: 14px; }
  .lista-mov .que span { font-size: 12px; color: var(--gris); }
  .lista-mov .icono { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; font-size: 15px; font-weight: 800; color: var(--fondo); }

  #tooltip { position: fixed; pointer-events: none; background: #0B1222; border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; font-size: 13px; min-width: 170px; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 10; }
  #tooltip .t { font-weight: 700; margin-bottom: 6px; }
  #tooltip .r { display: flex; justify-content: space-between; gap: 14px; }
  #tooltip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--texto-2); }
  #tooltip .total { border-top: 1px solid var(--borde); margin-top: 6px; padding-top: 6px; font-weight: 700; }
</style>
</head>
<body>

<section id="vistaLogin" class="centro" hidden>
  <form class="caja" id="formLogin">
    <div class="logo" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="#0F172A"><path d="M20,8h-3V4H3c-1.1,0 -2,0.9 -2,2v11h2c0,1.66 1.34,3 3,3s3,-1.34 3,-3h6c0,1.66 1.34,3 3,3s3,-1.34 3,-3h2v-5l-3,-4zM6,18.5c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5zM19.5,9.5l1.96,2.5H17V9.5h2.5zM18,18.5c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5z"/></svg>
    </div>
    <h1>Transportes Morales</h1>
    <p>Panel de consulta · entra con tu usuario de la app</p>
    <div class="campo"><label for="usuario">Usuario</label><input id="usuario" autocomplete="username" required></div>
    <div class="campo"><label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" required></div>
    <div class="error" id="errorLogin"></div>
    <button class="boton" id="botonEntrar" type="submit">Entrar</button>
  </form>
</section>

<section id="vistaMensaje" class="centro" hidden>
  <div class="caja">
    <h1 id="msgTitulo">Cargando…</h1>
    <p id="msgTexto"></p>
    <button class="boton-sec" id="botonSalir2" type="button">Cerrar sesión</button>
  </div>
</section>

<div id="vistaPanel" hidden>
  <nav class="lateral" aria-label="Menú">
    <div class="marca">
      <div class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="#0F172A"><path d="M20,8h-3V4H3c-1.1,0 -2,0.9 -2,2v11h2c0,1.66 1.34,3 3,3s3,-1.34 3,-3h6c0,1.66 1.34,3 3,3s3,-1.34 3,-3h2v-5l-3,-4zM6,18.5c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5zM19.5,9.5l1.96,2.5H17V9.5h2.5zM18,18.5c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5z"/></svg></div>
      <b>Transportes Morales<span id="usuarioLateral">Panel de consulta</span></b>
    </div>
    <div class="menu" id="menuLateral"></div>
    <div class="pie">
      <span>👁 Solo lectura</span>
      <button class="boton-sec" id="botonSalir" type="button">Cerrar sesión</button>
    </div>
  </nav>

  <div class="contenido">
    <main>
      <div class="encabezado">
        <h1><span id="titulo">Inicio</span> <span class="sub" id="subtitulo"></span></h1>
        <button class="boton-sec salir-movil" id="botonSalir3" type="button">Salir</button>
      </div>
      <div class="aviso-demo" id="avisoDemo" hidden>Estás viendo <b>datos de ejemplo</b>. Así se verá el panel con tus datos reales.</div>

      <div class="filtros">
        <div class="campo">
          <label for="fPeriodo">Periodo</label>
          <select id="fPeriodo">
            <option value="mes">Este mes</option>
            <option value="mesPasado">Mes pasado</option>
            <option value="3meses">Últimos 3 meses</option>
            <option value="anio">Este año</option>
            <option value="todo">Todo el historial</option>
          </select>
        </div>
        <div class="campo" id="campoCamion">
          <label for="fCamion">Camión</label>
          <select id="fCamion"><option value="">Todos los camiones</option></select>
        </div>
        <div class="campo" id="campoCategoria" hidden>
          <label for="fCategoria">Tipo de gasto</label>
          <select id="fCategoria"></select>
        </div>
      </div>

      <div id="seccion" style="display:flex;flex-direction:column;gap:20px"></div>
    </main>
  </div>

  <nav class="menu-abajo" id="menuAbajo" aria-label="Menú"></nav>
</div>

<div id="tooltip" hidden></div>

<script type="module">
// =====================================================================
//  CONFIGURACIÓN DE FIREBASE
// =====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyA2BY36dEe21QHQlpPi8A9yEpx4mxTtIqw",
  authDomain: "transportesmorales-9ceb7.firebaseapp.com",
  projectId: "transportesmorales-9ceb7",
  storageBucket: "transportesmorales-9ceb7.firebasestorage.app",
  messagingSenderId: "490305022901",
  appId: "1:490305022901:web:416356106158621ec747fc"
};
const DOMINIO_USUARIOS = "@miscamiones.app";
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";

// Colores por camión y por tipo de gasto (validados para daltonismo sobre el fondo oscuro), en orden fijo
const COLORES_CAMION = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"];
const CATEGORIAS = [
  { id: "PEAJE", nombre: "Peaje", color: "#199e70" },
  { id: "REPUESTOS", nombre: "Repuestos", color: "#d95926" },
  { id: "VIATICOS", nombre: "Viáticos", color: "#9085e9" },
  { id: "OTRO", nombre: "Otro", color: "#d55181" }
];
const CAT = Object.fromEntries(CATEGORIAS.map((c) => [c.id, c]));

const IC = {
  inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10H3z"/></svg>',
  diesel: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.77,7.23l0.01,-0.01 -3.72,-3.72L15,4.56l2.11,2.11c-0.94,0.36 -1.61,1.26 -1.61,2.33 0,1.38 1.12,2.5 2.5,2.5 0.36,0 0.69,-0.08 1,-0.21v7.21c0,0.55 -0.45,1 -1,1s-1,-0.45 -1,-1V14c0,-1.1 -0.9,-2 -2,-2h-1V5c0,-1.1 -0.9,-2 -2,-2H6c-1.1,0 -2,0.9 -2,2v16h10v-7.5h1.5v5c0,1.38 1.12,2.5 2.5,2.5s2.5,-1.12 2.5,-2.5V9c0,-0.69 -0.28,-1.32 -0.73,-1.77zM12,10H6V5h6v5zM18,10c-0.55,0 -1,-0.45 -1,-1s0.45,-1 1,-1 1,0.45 1,1 -0.45,1 -1,1z"/></svg>',
  gastos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16l-3-2-3 2-2-2-2 2-3-2-3 2z"/><path d="M8 9h8M8 13h5"/></svg>',
  personal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8"/><path d="M22 21a7 7 0 0 0-4-6.3"/></svg>',
  deudas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>'
};
const SECCIONES = [
  { id: "inicio", nombre: "Inicio" },
  { id: "diesel", nombre: "Diésel" },
  { id: "gastos", nombre: "Gastos" },
  { id: "personal", nombre: "Personal" },
  { id: "deudas", nombre: "Deudas" }
];

const $ = (id) => document.getElementById(id);
const fmtQ = (n) => "Q " + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtQcorto = (n) => n >= 1000 ? "Q " + (n / 1000).toLocaleString("en-US", { maximumFractionDigits: 1 }) + "k" : "Q " + Math.round(n);
const fmtGal = (n) => n.toLocaleString("en-US", { maximumFractionDigits: 1 });
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fmtFecha = (ms) => { const d = new Date(ms); return d.getDate() + " " + MESES[d.getMonth()] + " " + d.getFullYear(); };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const suma = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

const datos = { camiones: [], pilotos: [], diesel: [], movimientos: [] };
let mostrarTodo = {};

function mostrar(vista) {
  for (const v of ["vistaLogin", "vistaMensaje", "vistaPanel"]) $(v).hidden = v !== vista;
}
function mensaje(titulo, texto) {
  $("msgTitulo").textContent = titulo;
  $("msgTexto").textContent = texto || "";
  mostrar("vistaMensaje");
}

// ---------------- Menú y navegación ----------------
function seccionActual() {
  const h = location.hash.replace("#", "");
  return SECCIONES.some((s) => s.id === h) ? h : "inicio";
}
function pintarMenu() {
  const act = seccionActual();
  const html = SECCIONES.map((s) => `<a href="#${s.id}" class="${s.id === act ? "activo" : ""}" ${s.id === act ? 'aria-current="page"' : ""}>${IC[s.id]}<span>${s.nombre}</span></a>`).join("");
  $("menuLateral").innerHTML = html;
  $("menuAbajo").innerHTML = html;
}
window.addEventListener("hashchange", () => { mostrarTodo = {}; pintarMenu(); dibujar(); window.scrollTo(0, 0); });

// ---------------- Periodo ----------------
function rangoPeriodo() {
  const hoy = new Date();
  const y = hoy.getFullYear(), m = hoy.getMonth();
  const fin = new Date(y, m, hoy.getDate(), 23, 59, 59, 999).getTime();
  switch ($("fPeriodo").value) {
    case "mesPasado": return { ini: new Date(y, m - 1, 1).getTime(), fin: new Date(y, m, 1).getTime() - 1, txt: MESES[(m + 11) % 12] + " " + (m === 0 ? y - 1 : y) };
    case "3meses": return { ini: new Date(y, m - 2, 1).getTime(), fin, txt: "últimos 3 meses" };
    case "anio": return { ini: new Date(y, 0, 1).getTime(), fin, txt: "año " + y };
    case "todo": return { ini: 0, fin, txt: "todo el historial" };
    default: return { ini: new Date(y, m, 1).getTime(), fin, txt: MESES[m] + " " + y };
  }
}

// ---------------- Cálculos comunes ----------------
function contexto() {
  const { camiones, pilotos, diesel, movimientos } = datos;
  const colorCamion = {};
  camiones.forEach((c, i) => colorCamion[c.id] = COLORES_CAMION[i % COLORES_CAMION.length]);
  const nombreCamion = Object.fromEntries(camiones.map((c) => [c.id, c.nombre]));
  const nombrePersona = Object.fromEntries(pilotos.map((p) => [p.id, p.nombre]));

  const sel = $("fCamion"), elegido = sel.value;
  sel.innerHTML = '<option value="">Todos los camiones</option>' +
    camiones.map((c) => `<option value="${esc(c.id)}">${esc(c.nombre)}${c.placa ? " · " + esc(c.placa) : ""}</option>`).join("");
  sel.value = camiones.some((c) => c.id === elegido) ? elegido : "";
  const fCam = sel.value;

  const r = rangoPeriodo();
  const enRango = (ms) => ms >= r.ini && ms <= r.fin;
  const cargas = diesel.filter((d) => !fCam || d.camionId === fCam);
  const cargasRango = cargas.filter((d) => enRango(d.fecha));
  const movs = movimientos.filter((m) => m.tipo === "ADELANTO" || m.tipo === "ABONO" || m.tipo === "PAGO");
  const gastos = movimientos.filter((m) => m.tipo === "GASTO" && (!fCam || m.camionId === fCam));
  const gastosRango = gastos.filter((g) => enRango(g.fecha));
  const saldo = (pid) => suma(movs.filter((m) => m.pilotoId === pid), (m) => m.tipo === "ADELANTO" ? m.monto : m.tipo === "ABONO" ? -m.monto : 0);
  const camionesVisibles = fCam ? camiones.filter((c) => c.id === fCam) : camiones;
  return { camiones, pilotos, colorCamion, nombreCamion, nombrePersona, fCam, r, enRango, cargas, cargasRango, movs, gastos, gastosRango, saldo, camionesVisibles };
}

// ---------------- Dibujar la sección elegida ----------------
function dibujar() {
  const sec = seccionActual();
  const k = contexto();
  $("titulo").textContent = SECCIONES.find((x) => x.id === sec).nombre;
  $("subtitulo").textContent = k.r.txt.charAt(0).toUpperCase() + k.r.txt.slice(1) + (k.fCam && sec !== "personal" && sec !== "deudas" ? " · " + k.nombreCamion[k.fCam] : "");
  $("campoCamion").hidden = sec === "personal" || sec === "deudas";
  $("campoCategoria").hidden = sec !== "gastos";
  const vistas = { inicio: vistaInicio, diesel: vistaDiesel, gastos: vistaGastos, personal: vistaPersonal, deudas: vistaDeudas };
  $("seccion").innerHTML = vistas[sec](k);
  activarGraficas();
  document.querySelectorAll("[data-mas]").forEach((b) => b.addEventListener("click", () => { mostrarTodo[b.dataset.mas] = true; dibujar(); }));
}

function kpi(etq, val, det, acento, enlace) {
  const tag = enlace ? "a" : "div";
  return `<${tag} class="kpi" ${enlace ? `href="#${enlace}"` : ""} style="--acento:${acento}"><span class="etq">${etq}</span><span class="val">${val}</span><span class="det">${det}</span></${tag}>`;
}

// ---------- INICIO ----------
function vistaInicio(k) {
  const totalDiesel = suma(k.cargasRango, (d) => d.monto);
  const pendiente = suma(k.cargasRango.filter((d) => !d.pagado), (d) => d.monto);
  const totalGastos = suma(k.gastosRango, (g) => g.monto);
  const adelantado = suma(k.movs.filter((m) => m.tipo === "ADELANTO" && k.enRango(m.fecha)), (m) => m.monto);
  const deuda = suma(k.pilotos, (p) => Math.max(0, k.saldo(p.id)));
  const conDeuda = k.pilotos.filter((p) => k.saldo(p.id) > 0).length;

  const ult = [
    ...k.cargas.map((d) => ({ f: d.fecha, ic: "D", col: "#FBBF24", t: "Diésel · " + (k.nombreCamion[d.camionId] || "Camión"), s: fmtGal(d.galones) + " gal" + (d.pagado ? "" : " · pendiente"), v: fmtQ(d.monto) })),
    ...k.gastos.map((g) => ({ f: g.fecha, ic: "G", col: (CAT[g.categoria] || CAT.OTRO).color, t: g.titulo || "Gasto", s: (CAT[g.categoria] || CAT.OTRO).nombre + (k.nombreCamion[g.camionId] ? " · " + k.nombreCamion[g.camionId] : ""), v: fmtQ(g.monto) })),
    ...k.movs.map((m) => ({ f: m.fecha, ic: m.tipo === "ADELANTO" ? "+" : m.tipo === "ABONO" ? "−" : "S", col: m.tipo === "ADELANTO" ? "#60A5FA" : m.tipo === "ABONO" ? "#6EE7B7" : "#C4B5FD", t: (m.tipo === "ADELANTO" ? "Adelanto" : m.tipo === "ABONO" ? "Abono" : "Pago de salario") + " · " + (k.nombrePersona[m.pilotoId] || "?"), s: m.nota || "", v: fmtQ(m.monto) }))
  ].sort((a, b) => b.f - a.f).slice(0, 8);

  return `
    <div class="kpis">
      ${kpi("Diésel gastado", fmtQ(totalDiesel), `${fmtGal(suma(k.cargasRango, (d) => d.galones))} galones · ${k.cargasRango.length} cargas`, "var(--amarillo)", "diesel")}
      ${kpi("Diésel pendiente de pagar", fmtQ(pendiente), "Pagado: " + fmtQ(totalDiesel - pendiente), "var(--amarillo)", "diesel")}
      ${kpi("Otros gastos", fmtQ(totalGastos), k.gastosRango.length + " gastos · peajes, repuestos…", "var(--naranja)", "gastos")}
      ${kpi("Total adelantado", fmtQ(adelantado), "Pilotos y ayudantes", "var(--azul)", "personal")}
      ${kpi("Deudas pendientes (hoy)", fmtQ(deuda), conDeuda + (conDeuda === 1 ? " persona debe" : " personas deben"), "var(--rojo)", "deudas")}
    </div>
    <div class="tarjeta">
      <h2>Gasto total por mes</h2>
      <p class="nota">Diésel y otros gastos · últimos 12 meses · pasa el cursor sobre una barra para ver el detalle</p>
      ${graficaApilada("inicio", ultimos12(), [
        { id: "d", nombre: "Diésel", color: "#c98500", items: k.cargas },
        { id: "g", nombre: "Otros gastos", color: "#3987e5", items: k.gastos }
      ])}
    </div>
    <div class="tarjeta">
      <h2>Últimos movimientos</h2>
      ${ult.length === 0 ? '<div class="vacio">Aún no hay movimientos.</div>' : `<div class="lista-mov">${ult.map((u) => `
        <div><span class="icono" style="background:${u.col}">${u.ic}</span><span class="que"><b>${esc(u.t)}</b><span>${fmtFecha(u.f)}${u.s ? " · " + esc(u.s) : ""}</span></span><span class="num"><b>${u.v}</b></span></div>`).join("")}</div>`}
    </div>`;
}

// ---------- DIÉSEL ----------
function vistaDiesel(k) {
  const total = suma(k.cargasRango, (d) => d.monto), gal = suma(k.cargasRango, (d) => d.galones);
  const pend = suma(k.cargasRango.filter((d) => !d.pagado), (d) => d.monto);
  const filas = k.camionesVisibles.map((c) => {
    const suyas = k.cargasRango.filter((d) => d.camionId === c.id);
    return { c, n: suyas.length, gal: suma(suyas, (d) => d.galones), total: suma(suyas, (d) => d.monto), pend: suma(suyas.filter((d) => !d.pagado), (d) => d.monto) };
  }).sort((a, b) => b.total - a.total);
  const maxC = Math.max(1, ...filas.map((f) => f.total));
  const detalle = [...k.cargasRango].sort((a, b) => b.fecha - a.fecha);

  return `
    <div class="kpis">
      ${kpi("Total en diésel", fmtQ(total), k.cargasRango.length + " cargas", "var(--amarillo)")}
      ${kpi("Galones", fmtGal(gal), gal > 0 ? "Promedio " + fmtQ(total / gal) + " por galón" : "—", "var(--amarillo)")}
      ${kpi("Pendiente de pagar", fmtQ(pend), "Pagado: " + fmtQ(total - pend), "var(--rojo)")}
    </div>
    <div class="tarjeta">
      <h2>Diésel por mes</h2>
      <p class="nota">Últimos 12 meses por camión · pasa el cursor sobre una barra para ver el detalle</p>
      ${graficaApilada("diesel", ultimos12(), k.camionesVisibles.map((c) => ({ id: c.id, nombre: c.nombre, color: k.colorCamion[c.id], items: k.cargas.filter((d) => d.camionId === c.id) })))}
    </div>
    <div class="tarjeta">
      <h2>Diésel por camión</h2>
      ${filas.length === 0 ? '<div class="vacio">Aún no hay camiones registrados.</div>' : `<div class="tabla"><table>
        <thead><tr><th>Camión</th><th class="num">Cargas</th><th class="num">Galones</th><th class="num">Q / galón</th><th class="num">Total</th><th class="num">Pendiente</th><th style="width:20%"></th></tr></thead>
        <tbody>${filas.map((f) => `<tr>
          <td><span class="punto" style="background:${k.colorCamion[f.c.id]}"></span>${esc(f.c.nombre)}${f.c.placa ? ` <span class="tenue" style="font-size:12px">${esc(f.c.placa)}</span>` : ""}</td>
          <td class="num">${f.n}</td><td class="num">${fmtGal(f.gal)}</td><td class="num">${f.gal > 0 ? fmtQ(f.total / f.gal) : "—"}</td>
          <td class="num"><b>${fmtQ(f.total)}</b></td><td class="num">${f.pend > 0 ? fmtQ(f.pend) : '<span class="tenue">Q 0.00</span>'}</td>
          <td><div class="barrita"><div style="width:${(f.total / maxC * 100).toFixed(1)}%;background:${k.colorCamion[f.c.id]}"></div></div></td></tr>`).join("")}</tbody>
        <tfoot><tr><td>TOTAL</td><td class="num">${suma(filas, (f) => f.n)}</td><td class="num">${fmtGal(suma(filas, (f) => f.gal))}</td><td></td><td class="num">${fmtQ(suma(filas, (f) => f.total))}</td><td class="num">${fmtQ(suma(filas, (f) => f.pend))}</td><td></td></tr></tfoot>
      </table></div>`}
    </div>
    <div class="tarjeta">
      <h2>Detalle de cargas</h2>
      ${tablaDetalle("diesel", detalle,
        ["Fecha", "Camión", "Galones", "Q / galón", "Total", "Estado"], [false, false, true, true, true, false],
        (d) => [fmtFecha(d.fecha), `<span class="punto" style="background:${k.colorCamion[d.camionId] || "#64748B"}"></span>${esc(k.nombreCamion[d.camionId] || "Camión eliminado")}`, fmtGal(d.galones), d.galones > 0 ? fmtQ(d.monto / d.galones) : "—", `<b>${fmtQ(d.monto)}</b>`, d.pagado ? '<span class="estado aldia">✓ Pagado</span>' : '<span class="estado pend">● Pendiente</span>'],
        "Sin cargas de diésel en este periodo.")}

}

// ---------- GASTOS ----------

  const lista = k.gastosRango.filter((g) => !fCat || g.categoria === fCat);
  const total = suma(lista, (g) => g.monto);

    return { c, porCat: Object.fromEntries(cats.map((x) => [x.id, suma(suyos.filter((g) => g.categoria === x.id), (g) => g.monto)])), total: suma(suyos, (g) => g.monto) };

      <h2>Gastos por camión</h2>
      ${filasCam.length === 0 ? '<div class="vacio">Sin gastos en este periodo.</div>' : `<div class="tabla"><table>
        <thead><tr><th>Camión</th>${cats.map((c) => `<th class="num"><span class="punto" style="background:${c.color}"></span>${c.nombre}</th>`).join("")}<th class="num">Total</th></tr></thead>
        <tbody>${filasCam.map((f) => `<tr><td>${f.c.id ? `<span class="punto" style="background:${k.colorCamion[f.c.id]}"></span>` : ""}${esc(f.c.nombre)}</td>${cats.map((c) => `<td class="num">${f.porCat[c.id] > 0 ? fmtQ(f.porCat[c.id]) : '<span class="tenue">—</span>'}</td>`).join("")}<td class="num"><b>${fmtQ(f.total)}</b></td></tr>`).join("")}</tbody>
        <tfoot><tr><td>TOTAL</td>${cats.map((c) => `<td class="num">${fmtQ(suma(filasCam, (f) => f.porCat[c.id]))}</td>`).join("")}<td class="num">${fmtQ(total)}</td></tr></tfoot>
      </table></div>`}

    <div class="tarjeta">
      <h2>Detalle de gastos</h2>
      ${tablaDetalle("gastos", detalle,

        (g) => {
          const c = CAT[g.categoria] || CAT.OTRO;

}

// ---------- DEUDAS ----------
function vistaDeudas(k) {
  const deudores = k.pilotos.map((p) => ({ p, s: k.saldo(p.id) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s);
  return `
    <div class="kpis">
      ${kpi("Total que me deben", fmtQ(suma(deudores, (x) => x.s)), deudores.length + (deudores.length === 1 ? " persona" : " personas"), "var(--rojo)")}
    </div>
    <div class="tarjeta">
      <h2>Deudas pendientes</h2>
      <p class="nota">Lo que debe cada persona hoy, con sus adelantos y abonos (todo el historial)</p>
      <div class="deudas">${deudores.length === 0 ? '<div class="vacio">✓ Nadie debe nada en este momento.</div>' : deudores.map(({ p, s }) => {
        const suyos = k.movs.filter((m) => m.pilotoId === p.id).sort((a, b) => b.fecha - a.fecha);
        const ade = suyos.filter((m) => m.tipo === "ADELANTO"), abo = suyos.filter((m) => m.tipo === "ABONO");
        const tAde = suma(ade, (m) => m.monto), tAbo = suma(abo, (m) => m.monto);

        const lista = (arr, signo) => arr.length === 0 ? '<li><span class="tenue">Ninguno</span></li>' :
          arr.map((m) => `<li><span>${fmtFecha(m.fecha)}${m.nota ? ` · <span class="tenue">${esc(m.nota)}</span>` : ""}</span><span class="num">${signo} ${fmtQ(m.monto)}</span></li>`).join("");
        return `<div class="deuda">
          <div class="fila"><div><div class="nombre">${esc(p.nombre)}</div><div class="puesto">${p.tipo === "AYUDANTE" ? "Ayudante" : "Piloto"}${k.nombreCamion[p.camionId] ? " · " + esc(k.nombreCamion[p.camionId]) : ""}</div></div><div class="saldo">${fmtQ(s)}</div></div>
          <div class="progreso" title="Ha pagado ${avance.toFixed(0)}% de lo adelantado"><div style="width:${avance.toFixed(1)}%"></div></div>
          <div class="mini"><span>Adelantado ${fmtQ(tAde)}</span><span>Abonado ${fmtQ(tAbo)}</span></div>
          <details><summary>Ver abonos (${abo.length})</summary><ul>${lista(abo, "−")}</ul></details>
          <details><summary>Ver adelantos (${ade.length})</summary><ul>${lista(ade, "+")}</ul></details>
        </div>`;
      }).join("")}</div>
    </div>`;
}

// ---------- Tabla de detalle con "ver todos" ----------
function tablaDetalle(clave, filas, enc, derecha, celdas, vacio, total) {
  if (filas.length === 0) return `<div class="vacio">${vacio}</div>`;
  const LIM = 25, todas = mostrarTodo[clave], visibles = todas ? filas : filas.slice(0, LIM);
  return `<div class="tabla"><table>
    <thead><tr>${enc.map((e, i) => `<th class="${derecha[i] ? "num" : ""}">${e}</th>`).join("")}</tr></thead>
    <tbody>${visibles.map((f) => `<tr>${celdas(f).map((c, i) => `<td class="${derecha[i] ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
    ${total ? `<tfoot><tr><td>TOTAL</td>${enc.slice(1, -1).map(() => "<td></td>").join("")}<td class="num">${total}</td></tr></tfoot>` : ""}
  </table></div>
  ${!todas && filas.length > LIM ? `<button class="boton-sec mas" data-mas="${clave}">Ver los ${filas.length} registros</button>` : ""}`;
}

// ---------------- Gráfica de barras apiladas por mes (SVG) ----------------
function ultimos12() {
  const hoy = new Date(), meses = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    meses.push({ y: d.getFullYear(), m: d.getMonth(), ini: d.getTime(), fin: new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime() - 1 });
  }
  return meses;
}

const graficas = {};
function graficaApilada(id, meses, series) {
  const valores = meses.map((mes) => {
    const por = {};
    series.forEach((s) => por[s.id] = suma(s.items.filter((x) => x.fecha >= mes.ini && x.fecha <= mes.fin), (x) => x.monto));
    return { mes, por, total: Object.values(por).reduce((a, b) => a + b, 0) };
  });
  graficas[id] = { valores, series };

  const W = 900, H = 290, izq = 64, der = 12, arr = 18, aba = 34;
  const ancho = W - izq - der, alto = H - arr - aba;
  const maxV = Math.max(0, ...valores.map((v) => v.total));
  const paso = escalaBonita(maxV), tope = paso * 4;
  const y = (v) => arr + alto - (v / tope) * alto;
  const col = ancho / 12, barra = Math.min(46, col * 0.62);
  const iMax = valores.findIndex((v) => v.total > 0 && v.total === maxV);

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica por mes">`;
  for (let i = 0; i <= 4; i++) {
    const v = paso * i, yy = y(v);
    svg += `<line x1="${izq}" x2="${W - der}" y1="${yy}" y2="${yy}" stroke="${i === 0 ? "#475569" : "#2b3a52"}" stroke-width="1"/>`;
    svg += `<text x="${izq - 10}" y="${yy + 4}" text-anchor="end" font-size="12" fill="#94A3B8">${fmtQcorto(v)}</text>`;
  }
  valores.forEach((v, i) => {
    const cx = izq + col * i + col / 2, x = cx - barra / 2;
    let base = 0;
    const segs = series.filter((s) => v.por[s.id] > 0);
    segs.forEach((s, j) => {
      const val = v.por[s.id], y1 = y(base + val), y0 = y(base);
      svg += j === segs.length - 1 ? `<path d="${rectArriba(x, y1, barra, y0 - y1, 4)}" fill="${s.color}"/>`
        : `<rect x="${x}" y="${y1 + 2}" width="${barra}" height="${Math.max(0, y0 - y1 - 2)}" fill="${s.color}"/>`;
      base += val;
    });
    const etq = MESES[v.mes.m] + (v.mes.m === 0 || i === 0 ? " " + String(v.mes.y).slice(2) : "");
    svg += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="12" fill="#94A3B8">${etq}</text>`;
    if (i === iMax) svg += `<text x="${cx}" y="${y(v.total) - 6}" text-anchor="middle" font-size="11" font-weight="700" fill="#CBD5E1">${fmtQcorto(v.total)}</text>`;
    svg += `<rect class="zona" data-g="${id}" data-i="${i}" x="${izq + col * i}" y="${arr}" width="${col}" height="${alto}" fill="transparent"/>`;
  });
  svg += "</svg>";
  const leyenda = series.length > 1 ? `<div class="leyenda">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.nombre)}</span>`).join("")}</div>` : "";
  return leyenda + `<div class="grafica">${svg}</div>` + (maxV === 0 ? '<div class="vacio">Sin registros en los últimos 12 meses.</div>' : "");
}

function activarGraficas() {
  const tt = $("tooltip");
  tt.hidden = true;
  document.querySelectorAll(".zona").forEach((z) => {
    z.addEventListener("mousemove", (e) => {
      const g = graficas[z.dataset.g], v = g.valores[+z.dataset.i];
      tt.innerHTML = `<div class="t">${MESES[v.mes.m]} ${v.mes.y}</div>` +
        g.series.filter((s) => v.por[s.id] > 0).map((s) =>
          `<div class="r"><span><i class="punto" style="background:${s.color};margin:0"></i>${esc(s.nombre)}</span><span>${fmtQ(v.por[s.id])}</span></div>`).join("") +
        `<div class="r total"><span>Total</span><span>${fmtQ(v.total)}</span></div>`;
      tt.hidden = false;
      tt.style.left = Math.min(e.clientX + 14, window.innerWidth - tt.offsetWidth - 8) + "px";
      tt.style.top = Math.max(8, e.clientY - tt.offsetHeight - 10) + "px";
      z.setAttribute("fill", "rgba(148,163,184,0.08)");
    });
    z.addEventListener("mouseleave", () => { tt.hidden = true; z.setAttribute("fill", "transparent"); });
  });
}

function escalaBonita(max) {
  if (max <= 0) return 1000;
  const bruto = max / 4, mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  for (const f of [1, 2, 2.5, 5, 10]) if (f * mag >= bruto) return f * mag;
  return 10 * mag;
}
function rectArriba(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}

// ---------------- Firebase: login + lectura en tiempo real (nunca escribe) ----------------
async function iniciarFirebase() {
  const [{ initializeApp }, authMod, fsMod] = await Promise.all([
    import(FB + "firebase-app.js"), import(FB + "firebase-auth.js"), import(FB + "firebase-firestore.js")
  ]);
  const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } = authMod;
  const { getFirestore, doc, getDoc, collection, onSnapshot } = fsMod;
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app), db = getFirestore(app);
  let escuchas = [];

  const salir = () => { escuchas.forEach((u) => u()); escuchas = []; signOut(auth); };
  $("botonSalir").onclick = salir;
  $("botonSalir2").onclick = salir;
  $("botonSalir3").onclick = salir;

  $("formLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const u = $("usuario").value.trim().toLowerCase();
    $("errorLogin").textContent = "";
    $("botonEntrar").disabled = true;
    try {
      await signInWithEmailAndPassword(auth, u + DOMINIO_USUARIOS, $("clave").value);
    } catch (err) {
      const c = err.code || "";
      $("errorLogin").textContent = c.includes("invalid") || c.includes("wrong") || c.includes("not-found")
        ? "Usuario o contraseña incorrectos" : c.includes("network") ? "Sin internet" : "No se pudo entrar (" + c + ")";
    }
    $("botonEntrar").disabled = false;
  });

  onAuthStateChanged(auth, async (user) => {
    escuchas.forEach((u) => u()); escuchas = [];
    if (!user) { mostrar("vistaLogin"); return; }
    mensaje("Cargando…", "");
    try {
      const e = await getDoc(doc(db, "empresa", "principal"));
      const esMaster = e.exists() && e.data().master === user.uid;
      if (!esMaster) {
        const miembro = await getDoc(doc(db, "empresa", "principal", "miembros", user.uid));
        if (!miembro.exists()) { mensaje("Sin acceso todavía", "Tu usuario aún no ha sido aprobado por el máster. Pídele que te apruebe en la app (Inicio → Usuarios)."); return; }
      }
      const escuchar = (col, mapear) => escuchas.push(onSnapshot(collection(db, "empresa", "principal", col), (snap) => {
        datos[col] = snap.docs.map((d) => mapear(d.id, d.data()));
        if (col === "camiones" || col === "pilotos") datos[col].sort((a, b) => a.nombre.localeCompare(b.nombre));
        dibujar();
      }, () => mensaje("No se pudieron leer los datos", "Revisa tu conexión o tus permisos.")));
      escuchar("camiones", (id, x) => ({ id, nombre: x.nombre || "", placa: x.placa || "" }));
      escuchar("pilotos", (id, x) => ({ id, nombre: x.nombre || "", camionId: x.camionId || "", tipo: x.tipo || "PILOTO", salario: x.salario || 0 }));
      escuchar("diesel", (id, x) => ({ id, camionId: x.camionId || "", fecha: x.fecha || 0, galones: x.galones || 0, monto: x.monto || 0, pagado: !!x.pagado }));
      escuchar("movimientos", (id, x) => ({ id, pilotoId: x.pilotoId || "", tipo: x.tipo || "", monto: x.monto || 0, fecha: x.fecha || 0, nota: x.nota || "", categoria: x.categoria || "OTRO", titulo: x.titulo || "", camionId: x.camionId || "" }));
      $("usuarioLateral").textContent = user.email.replace(DOMINIO_USUARIOS, "") + (esMaster ? " · máster" : "");
      mostrar("vistaPanel");
      pintarMenu();
      dibujar();
    } catch (err) {
      mensaje("No se pudo cargar", String(err.message || err));
    }
  });
}
